<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search - Movie Hub</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 0;

            background: #0f1115;

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .container {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;

            padding: 15px;
        }


        /* ==========================================
           HEADER
        ========================================== */

        .top-header {
            width: 100%;
            height: 64px;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 8px 14px;

            margin-bottom: 15px;

            background: #0b0d13;

            border: 1px solid #252933;

            border-radius: 8px;
        }


        .header-back {
            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: none;

            border-radius: 8px;

            background: #25205a;

            color: #ffffff;

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;
        }


        .header-back:hover {
            background: #352d78;
        }


        .header-logo {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #7047e8;

            border-radius: 9px;

            font-size: 20px;
        }


        .header-title {
            font-size: 23px;

            font-weight: 700;
        }


        .header-title span {
            color: #9b7cff;
        }


        /* ==========================================
           SEARCH
        ========================================== */

        .search-box {
            display: flex;

            gap: 10px;

            width: 100%;

            margin-bottom: 20px;
        }


        .search-input {
            flex: 1;

            min-width: 0;

            padding: 14px 16px;

            background: #181b21;

            border: 1px solid #30343d;

            border-radius: 8px;

            outline: none;

            color: #ffffff;

            font-size: 16px;
        }


        .search-input:focus {
            border-color: #7047e8;
        }


        .search-button {
            padding: 14px 22px;

            border: none;

            border-radius: 8px;

            background: #7047e8;

            color: #ffffff;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .search-button:hover {
            background: #825df0;
        }


        /* ==========================================
           SEARCH TITLE
        ========================================== */

        .search-title {
            margin: 0 0 15px 0;

            font-size: 22px;

            line-height: 1.4;

            word-break: break-word;
        }


        /* ==========================================
           RESULTS
        ========================================== */

        .results {
            display: flex;

            flex-direction: column;

            gap: 12px;
        }


        .movie {
            display: flex;

            gap: 15px;

            width: 100%;

            padding: 12px;

            background: #181b21;

            border: 1px solid #292d35;

            border-radius: 10px;

            text-decoration: none;

            color: #ffffff;

            transition:
                border-color 0.2s ease,
                transform 0.15s ease;
        }


        .movie:hover {
            border-color: #7047e8;

            transform: translateY(-1px);
        }


        .poster {
            width: 90px;
            height: 125px;

            flex-shrink: 0;

            object-fit: cover;

            border-radius: 7px;

            background: #252933;
        }


        .movie-info {
            min-width: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .movie-title {
            margin: 0 0 10px 0;

            font-size: 17px;

            font-weight: bold;

            line-height: 1.4;

            word-break: break-word;
        }


        .movie-folder {
            color: #9b7cff;

            font-size: 14px;

            line-height: 1.4;
        }


        /* ==========================================
           LOADING / EMPTY / ERROR
        ========================================== */

        .loading,
        .empty,
        .error {
            padding: 30px 10px;

            text-align: center;

            color: #aeb5c0;
        }


        .error {
            display: none;

            color: #ffb4b4;

            line-height: 1.5;
        }


        .empty {
            display: none;
        }


        /* ==========================================
           PAGINATION
        ========================================== */

        .pagination {
            display: none;

            align-items: center;

            justify-content: center;

            gap: 10px;

            margin-top: 20px;
        }


        .page-button {
            padding: 10px 18px;

            border: 1px solid #30343d;

            border-radius: 8px;

            background: #181b21;

            color: #ffffff;

            cursor: pointer;

            font-weight: bold;
        }


        .page-button:hover:not(:disabled) {
            background: #252933;

            border-color: #7047e8;
        }


        .page-button:disabled {
            opacity: 0.4;

            cursor: not-allowed;
        }


        .page-number {
            color: #aeb5c0;

            font-size: 14px;
        }


        /* ==========================================
           MOBILE
        ========================================== */

        @media (max-width: 600px) {

            .container {
                padding: 12px;
            }


            .search-box {
                flex-direction: column;
            }


            .search-button {
                width: 100%;
            }


            .poster {
                width: 75px;

                height: 105px;
            }


            .movie-title {
                font-size: 15px;
            }


            .header-title {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- ==========================================
         HEADER
    ========================================== -->

    <div class="top-header">


        <button
            class="header-back"
            type="button"
            onclick="goBack()"
            aria-label="Go Back"
        >
            ←
        </button>


        <div class="header-logo">
            🎬
        </div>


        <div class="header-title">
            Movie <span>Hub</span>
        </div>


    </div>


    <!-- ==========================================
         SEARCH
    ========================================== -->

    <form
        class="search-box"
        id="searchForm"
    >


        <input
            class="search-input"
            id="searchInput"
            type="search"
            placeholder="Search movies..."
            autocomplete="off"
        >


        <button
            class="search-button"
            type="submit"
        >
            Search
        </button>


    </form>


    <!-- ==========================================
         TITLE
    ========================================== -->

    <h1
        class="search-title"
        id="searchTitle"
    >
        Search Results
    </h1>


    <!-- ==========================================
         LOADING
    ========================================== -->

    <div
        class="loading"
        id="loading"
    >
        Searching...
    </div>


    <!-- ==========================================
         ERROR
    ========================================== -->

    <div
        class="error"
        id="error"
    ></div>


    <!-- ==========================================
         EMPTY
    ========================================== -->

    <div
        class="empty"
        id="empty"
    >
        No movies found.
    </div>


    <!-- ==========================================
         RESULTS
    ========================================== -->

    <div
        class="results"
        id="results"
    ></div>


    <!-- ==========================================
         PAGINATION
    ========================================== -->

    <div
        class="pagination"
        id="pagination"
    >

        <button
            class="page-button"
            id="previousButton"
            type="button"
            onclick="changePage(-1)"
        >
            Previous
        </button>


        <div
            class="page-number"
            id="pageNumber"
        >
            Page 1
        </div>


        <button
            class="page-button"
            id="nextButton"
            type="button"
            onclick="changePage(1)"
        >
            Next
        </button>

    </div>


</div>


<script>


/* ==========================================
   GLOBAL
========================================== */

let currentPage = 1;

let totalPages = 1;

let currentSearch = "";


/* ==========================================
   BACK
========================================== */

function goBack() {

    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.location.href = "/";

    }

}


/* ==========================================
   CREATE SLUG
========================================== */

function makeSlug(title) {

    return String(
        title || ""
    )
        .trim()

        // Remove ()
        .replace(
            /[()]/g,
            ""
        )

        // Spaces -> -
        .replace(
            /\s+/g,
            "-"
        )

        // Multiple - -> single -
        .replace(
            /-+/g,
            "-"
        )

        // Remove first/last -
        .replace(
            /^-|-$/g,
            "");

}


/* ==========================================
   GET SEARCH PARAM
========================================== */

function getSearchFromUrl() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    return (
        params.get("search") ||
        ""
    ).trim();

}


/* ==========================================
   UPDATE URL
========================================== */

function updateSearchUrl(
    search,
    page
) {

    const params =
        new URLSearchParams();


    params.set(
        "search",
        search
    );


    if (page > 1) {

        params.set(
            "page",
            page
        );

    }


    window.history.pushState(
        {},
        "",
        "/search?" +
        params.toString()
    );

}


/* ==========================================
   LOAD SEARCH
========================================== */

async function loadSearch(
    search,
    page = 1
) {


    const loading =
        document.getElementById(
            "loading"
        );


    const error =
        document.getElementById(
            "error"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    const results =
        document.getElementById(
            "results"
        );


    const pagination =
        document.getElementById(
            "pagination"
        );


    const pageNumber =
        document.getElementById(
            "pageNumber"
        );


    const previousButton =
        document.getElementById(
            "previousButton"
        );


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    const searchTitle =
        document.getElementById(
            "searchTitle"
        );


    if (!search) {

        loading.style.display =
            "none";

        empty.textContent =
            "Search something first.";

        empty.style.display =
            "block";

        return;

    }


    currentSearch =
        search;

    currentPage =
        page;


    searchTitle.textContent =
        'Search results for "' +
        search +
        '"';


    loading.style.display =
        "block";

    error.style.display =
        "none";

    empty.style.display =
        "none";

    results.innerHTML = "";

    pagination.style.display =
        "none";


    try {


        /*
        ========================================
        API
        ========================================
        */

        const apiUrl =
            "/api/search?search=" +
            encodeURIComponent(
                search
            ) +
            "&page=" +
            encodeURIComponent(
                page
            ) +
            "&per_page=20";


        const response =
            await fetch(
                apiUrl,
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Search API failed. HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Search failed."
            );

        }


        loading.style.display =
            "none";


        /*
        ========================================
        RESULTS
        ========================================
        */

        if (
            !Array.isArray(
                data.results
            ) ||
            data.results.length === 0
        ) {

            empty.textContent =
                "No movies found.";

            empty.style.display =
                "block";

            return;

        }


        data.results.forEach(
            function(movie) {


                if (
                    !movie ||
                    !movie.filmyfly ||
                    !movie.title
                ) {

                    return;

                }


                const slug =
                    movie.slug ||
                    makeSlug(
                        movie.title
                    );


                /*
                --------------------------------
                MOVIE URL
                --------------------------------
                */

                const movieUrl =
                    "/movie/" +
                    encodeURIComponent(
                        movie.filmyfly
                    ) +
                    "/" +
                    encodeURIComponent(
                        slug
                    ) +
                    ".html";


                const movieLink =
                    document.createElement(
                        "a"
                    );


                movieLink.className =
                    "movie";


                movieLink.href =
                    movieUrl;


                /*
                --------------------------------
                POSTER
                --------------------------------
                */

                const poster =
                    document.createElement(
                        "img"
                    );


                poster.className =
                    "poster";


                poster.src =
                    movie.poster ||
                    "";


                poster.alt =
                    movie.title;


                poster.loading =
                    "lazy";


                poster.onerror =
                    function() {

                        this.style.display =
                            "none";

                    };


                /*
                --------------------------------
                MOVIE INFO
                --------------------------------
                */

                const info =
                    document.createElement(
                        "div"
                    );


                info.className =
                    "movie-info";


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "movie-title";


                title.textContent =
                    movie.title;


                const folder =
                    document.createElement(
                        "div"
                    );


                folder.className =
                    "movie-folder";


                folder.textContent =
                    movie.foldern ||
                    "";


                info.appendChild(
                    title
                );


                if (
                    movie.foldern
                ) {

                    info.appendChild(
                        folder
                    );

                }


                movieLink.appendChild(
                    poster
                );


                movieLink.appendChild(
                    info
                );


                results.appendChild(
                    movieLink
                );

            }
        );


        /*
        ========================================
        PAGINATION
        ========================================
        */

        totalPages =
            Number(
                data.total_pages || 1
            );


        currentPage =
            Number(
                data.page || page
            );


        if (
            totalPages > 1
        ) {

            pagination.style.display =
                "flex";


            pageNumber.textContent =
                "Page " +
                currentPage +
                " of " +
                totalPages;


            previousButton.disabled =
                currentPage <= 1;


            nextButton.disabled =
                currentPage >= totalPages;

        }


        updateSearchUrl(
            search,
            currentPage
        );


    }


    catch (err) {

        console.error(
            "Search error:",
            err
        );


        loading.style.display =
            "none";


        error.textContent =
            err.message ||
            "Something went wrong.";


        error.style.display =
            "block";

    }

}


/* ==========================================
   CHANGE PAGE
========================================== */

function changePage(
    direction
) {

    const newPage =
        currentPage +
        direction;


    if (
        newPage < 1 ||
        newPage > totalPages
    ) {

        return;

    }


    loadSearch(
        currentSearch,
        newPage
    );

}


/* ==========================================
   SEARCH FORM
========================================== */

document
    .getElementById("searchForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const search =
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .trim();


            if (!search) {

                return;

            }


            currentPage = 1;


            loadSearch(
                search,
                1
            );

        }
    );


/* ==========================================
   INITIAL LOAD
========================================== */

const initialSearch =
    getSearchFromUrl();


const initialParams =
    new URLSearchParams(
        window.location.search
    );


const initialPage =
    Math.max(
        1,
        Number(
            initialParams.get(
                "page"
            ) || 1
        )
    );


document
    .getElementById(
        "searchInput"
    )
    .value =
    initialSearch;


loadSearch(
    initialSearch,
    initialPage
);


/* ==========================================
   BROWSER BACK/FORWARD
========================================== */

window.addEventListener(
    "popstate",
    function() {

        const search =
            getSearchFromUrl();


        const params =
            new URLSearchParams(
                window.location.search
            );


        const page =
            Math.max(
                1,
                Number(
                    params.get(
                        "page"
                    ) || 1
                )
            );


        document
            .getElementById(
                "searchInput"
            )
            .value =
            search;


        loadSearch(
            search,
            page
        );

    }
);

</script>


</body>

</html>
